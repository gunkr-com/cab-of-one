# cab-of-one module rules (DESIGN §10-4-4). Data only.
#
# Each [[module]] has one condition: always (core only), when_any (a boolean field is true or
# a list field is non-empty) or when_eq (every listed enum/boolean field equals its value).
# Nothing is evaluated. Modules apply in id order and may not write the same file.
#
# The core module is the floor. The generator refuses this file if core is missing, is not
# `always`, or lacks one of its required file mappings. Settings, policy and the standard
# change catalogue are generated by code, not by modules.
schema = 1

[[module]]
id = "core"
description = "Floor: hook entries, pinned runtime, agents, skills and the CLAUDE.md block."
always = true
files = [
  { src = "templates/core/hooks/", dst = ".claude/hooks/cab/" },
  { src = "src/cab_of_one/__init__.py", dst = ".claude/hooks/cab/cab_of_one/__init__.py" },
  { src = "src/cab_of_one/runtime/", dst = ".claude/hooks/cab/cab_of_one/runtime/" },
  { src = "templates/core/agents/", dst = ".claude/agents/" },
  { src = "templates/core/skills/", dst = ".claude/skills/" },
  { src = "templates/core/CLAUDE.md", dst = "CLAUDE.md", substitute = true },
  # Evidence folder READMEs: created once, then a person's files (never overwritten or
  # removed by setup). Only the README itself; nothing else under changes/ or audit/.
  { src = "changes/README.md", dst = "changes/README.md" },
  { src = "audit/README.md", dst = "audit/README.md" },
]

[[module]]
id = "m365-powershell"
description = "Microsoft 365 PowerShell classifier adapter."
when_any = [
  "systems.entra",
  "systems.exchange_online",
  "systems.intune",
  "systems.sharepoint_teams",
  "surfaces.powershell_modules",
]
adapters = ["m365-powershell"]

[[module]]
id = "graph-http"
description = "Microsoft Graph HTTP classifier adapter."
when_any = [
  "systems.entra",
  "systems.exchange_online",
  "systems.intune",
  "systems.sharepoint_teams",
  "surfaces.graph_http",
]
adapters = ["graph-http"]

[[module]]
id = "azure-cli"
description = "Azure CLI classifier adapter."
when_any = ["systems.azure", "surfaces.azure_cli"]
adapters = ["azure-cli"]

[[module]]
id = "mcp-write-servers"
description = "Tools of the named MCP servers classify as administrative writes."
when_any = ["surfaces.mcp_write_servers"]
features = ["mcp_write_servers"]

[[module]]
id = "identity-admin"
description = "The agent runs with an admin identity."
when_eq = { "identity.agent_identity" = "admin" }
# Generator-owned (exact path in the manifest): updated while unchanged, a person's edit
# becomes a .cab-new proposal, removed on uninstall only when unchanged.
files = [{ src = "docs/identity.md", dst = "docs/identity.md" }]
notices = [
  "The agent uses an admin identity. Give it a separate read-only identity and keep write credentials for people and gated wrappers.",
]

[[module]]
id = "read-deny"
description = "Read deny rules for credential paths."
when_any = ["identity.deny_read_paths"]
features = ["read_deny_paths"]
notices = [
  "Read deny rules stop Claude's file tools only. Add the same paths to your user-level sandbox read deny as well.",
]

[[module]]
id = "bypass-lock"
description = "Manual operation: bypass permissions mode is disabled for this project."
when_eq = { "session.permission_mode" = "manual" }
features = ["disable_bypass_mode"]

[[module]]
id = "bypass-guarded"
description = "Bypass mode inside the guard rails."
when_eq = { "session.permission_mode" = "bypass-guarded" }
notices = [
  "Bypass mode: deny rules and the guard still apply; allow rules do not. Re-run the bypass checks after every settings change.",
]

[[module]]
id = "auto-mode"
description = "Auto permission mode."
when_eq = { "session.permission_mode" = "auto" }
notices = [
  "Auto mode: the auto classifier is not a gate. The guard and deny rules stay in force.",
]

[[module]]
id = "handoff"
description = "Work moves between machines."
when_any = ["session.multi_machine"]
# Created once, then a person's files (never overwritten or removed by setup).
files = [
  { src = "templates/handoff/HANDOFF.md", dst = "HANDOFF.md" },
  { src = "templates/handoff/PROGRESS.md", dst = "PROGRESS.md" },
]
notices = [
  "You work from several machines: keep PROGRESS.md and HANDOFF.md current at the end of each session.",
]

[[module]]
id = "sync-folder"
description = "The project lives in a cloud-synced folder."
when_any = ["session.sync_folder"]
notices = [
  "A cloud-synced folder cannot pin the audit ledger. Keep the project in a private git repository.",
]

[[module]]
id = "no-git"
description = "The project is not a git repository."
when_eq = { "session.git" = false }
notices = [
  "This project is not a git repository. Run git init yourself; the generator does not.",
]

[[module]]
id = "simtenant-demo"
description = "Fictional Contoso tenant for the demo. Reference profiles only."
when_any = ["systems.demo_simtenant"]
adapters = ["simtenant"]
features = ["simtenant_trust"]
# Generator-owned, exactly these two paths (manifest DEMO_FILES). Any other file below
# simtenant/ in a project is never generated, recorded or removed.
files = [
  { src = "simtenant/simtenant.py", dst = "simtenant/simtenant.py" },
  { src = "simtenant/seed/contoso.json", dst = "simtenant/seed/contoso.json" },
]
