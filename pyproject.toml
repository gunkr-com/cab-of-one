[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cab-of-one"
version = "0.1.0.dev0"
description = "Change control for AI agents that run IT operations."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cab = "cab_of_one.runtime.cli:console_main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cab_of_one*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
cache-dir = ".local/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
